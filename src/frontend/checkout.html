<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Oficial | Mente Serena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/checkout.css">
    <script src="js/checkout.js" defer></script>
    <script src="js/theme.js"></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Mente Serena Curso Completo</h1>
            <p>Desenvolva calma, resiliência e comunicação assertiva com estratégias inspiradas em pesquisas de
                psicologia e neurociência.</p>
        </header>

        <section class="checkout-card">
            <div class="price-info">
                <span class="original-price">Escolha seu plano:</span>
            </div>

            <form id="checkout-form">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail de Acesso</label>
                    <input type="email" id="email" name="email" required placeholder="seu.melhor@email.com">
                </div>

                <fieldset class="plan-selection"
                    style="margin-bottom: 1.5rem; border: 1px solid var(--border-color, #ccc); padding: 1rem; border-radius: 8px;">
                    <legend style="font-weight: 600; padding: 0 0.5rem;">Selecione o Plano</legend>
                    <div class="plan-option" style="margin-bottom: 0.5rem;">
                        <input type="radio" id="plan-standard" name="plan" value="standard" checked>
                        <label for="plan-standard" style="display: inline-block; cursor: pointer;">
                            <strong>Plano Standard</strong> - R$ 350,00 (ou em at� 12x via Mercado Pago)
                        </label>
                    </div>
                    <div class="plan-option">
                        <input type="radio" id="plan-premium" name="plan" value="premium">
                        <label for="plan-premium" style="display: inline-block; cursor: pointer;">
                            <strong>Plano Premium</strong> - R$ 500,00 (ou em at� 12x via Mercado Pago)
                        </label>
                    </div>
                </fieldset>

                <div class="form-group alert notice"
                    style="background-color: var(--alert-bg, #fff3cd); padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.9rem;">
                    <strong>Aviso:</strong> Pagamento processado com seguran�a pelo Mercado Pago.
                </div>

                <div class="actions">
                    <button type="submit" id="btn-comprar" class="btn-primary" style="width: 100%;">
                        <span class="btn-text" id="btn-comprar-text">Garantir Minha Vaga no Mercado Pago</span>
                        <div class="loader" hidden></div>
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
