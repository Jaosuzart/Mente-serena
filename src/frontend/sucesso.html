<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado | Mente Serena</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="icon" type="image/webp" href="assets/images/logo-premium.webp">
    <script src="js/theme.js"></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>🎉 Pagamento Aprovado!</h1>
            <p>Seja bem-vindo(a) ao Mente Serena.</p>
        </header>

        <section class="checkout-card" style="text-align: center;">
            <p>O seu pagamento foi confirmado com sucesso. Você receberá um e-mail em breve com as instruções de acesso ao curso.</p>
            <p id="order-id-display" style="margin-top: 12px; font-size: 0.85rem; color: var(--text-muted, #aaa); display: none;">
                Número do pedido: <strong id="order-id-value"></strong>
            </p>
            <div class="actions" style="margin-top: 30px;">
                <a href="/" class="btn-primary" style="display: inline-block; text-decoration: none;">Voltar para o Início</a>
            </div>
        </section>
    </main>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const orderId =
                params.get('external_reference') ||
                params.get('order_id') ||
                sessionStorage.getItem('ms_order_id');

            if (orderId) {
                const display = document.getElementById('order-id-display');
                const value = document.getElementById('order-id-value');
                value.textContent = orderId;
                display.style.display = 'block';
                sessionStorage.setItem('ms_order_id', orderId);
            }
        })();
    </script>
</body>

</html>
