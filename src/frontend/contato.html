<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="assets/images/hero.webp">
    <title>Contato | Mente Serena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>

<body class="bg-light-ms">
    <a href="#main-content" class="visually-hidden-focusable">Pular para o conte�do principal</a>

    <nav class="navbar navbar-expand-lg navbar-ms fixed-top border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">&larr; Mente Serena</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 120px; margin-bottom: 80px; max-width: 800px;">
        <h1 class="mb-4">Fale Conosco</h1>

        <div class="bg-body p-4 p-md-5 rounded-4 shadow-sm ">
            <p class="lead  mb-5">Estamos aqui para ajudar. Se você tiver dúvidas sobre o curso, acesso �
                plataforma ou solicitaçõeses, envie uma mensagem.</p>

            <form action="#" method="POST" id="contatoForm">
                <div class="mb-4">
                    <label for="nome" class="form-label fw-semibold ">Nome completo</label>
                    <input type="text" class="form-control form-control-lg" id="nome" required
                        placeholder="Como prefere ser chamado(a)">
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold ">Endereço de e-mail</label>
                    <input type="email" class="form-control form-control-lg" id="email" required
                        placeholder="Seu e-mail de acesso">
                </div>

                <div class="mb-4">
                    <label for="assunto" class="form-label fw-semibold ">Assunto</label>
                    <select class="form-select form-select-lg" id="assunto" required>
                        <option value="" selected disabled>Selecione o motivo do contato</option>
                        <option value="duvida">Dúvida sobre o curso</option>
                        <option value="acesso">Problema de acesso</option>
                        <option value="financeiro">Financeiro / Reembolso</option>
                        <option value="outro">Outro assunto</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="mensagem" class="form-label fw-semibold ">Mensagem</label>
                    <textarea class="form-control form-control-lg" id="mensagem" rows="5" required
                        placeholder="Como podemos ajudar?"></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-ms-primary btn-lg">Enviar mensagem</button>
                </div>
            </form>

            <div class="mt-5 text-center small border-top pt-4">
                <p>Nosso tempo de resposta é de até 2 dias úteis.</p>
                <p>E-mail direto: <a href="mailto:suporte@menteserena.com.br"
                        class="text-primary-ms fw-semibold">suporte@menteserena.com.br</a></p>
            </div>
        </div>
    </div>

</body>

</html>
